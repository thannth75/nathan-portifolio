name: Update Project Previews

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  update-previews:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Capture project previews
        run: npm run update-previews

      - name: Commit preview changes
        run: |
          if git diff --quiet -- public/project-previews/; then
            echo "Nenhuma preview alterada."
            exit 0
          fi

          git add public/project-previews/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: atualizar previews dos projetos"
          git push
